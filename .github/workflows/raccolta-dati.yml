name: Raccolta dati GTA 6

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore (orario UTC); GitHub a volte parte con qualche minuto di ritardo
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: raccolta-dati
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Raccogli i dati
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python strumenti/raccolta_dati.py
      - name: Salva i dati nel repo
        run: |
          git config user.name "raccolta-dati"
          git config user.email "raccolta-dati@users.noreply.github.com"
          git add dati/
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "Dati aggiornati $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
